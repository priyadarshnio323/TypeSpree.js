<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>TypeSpree – Typing Speed Test</title>
</head>
<body>

    <nav>
        <p class="logo">Type<span>Spree</span></p>
        <!-- <ul class="nav-links">
            <li><a href="index.html" class="active nav-link">Home</a></li>
            <li><a href="techniques.html" class="nav-link">Techniques</a></li>
            <li><a href="benefits.html" class="nav-link">Benefits</a></li>
            <li><a href="feedback.html" class="nav-link">Feedback</a></li>
        </ul> -->
    </nav>

    <div class="outer">

           <div class="mainblock">

    <div class="badge">
        <span>Typing Challenge</span>
    </div>

    <h1>Test your <span class="accent">speed.</span></h1>
    <p class="subtitle">Words per minute · Characters per minute · Real-time feedback</p>

    <div class="timer">
        <div class="s stat-card">
            <span class="secs"><span id="time-value">60</span>s</span>
        </div>
        <div class="wds stat-card">
            <span class="words">0</span>
            <span class="wpm">wpm</span>
        </div>
        <div class="chrs stat-card">
            <span class="chars">0</span>
            <span class="cpm">cpm</span>
        </div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="testbox">
        <input type="text" class="textbox" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <span class="paragraph"></span>
    </div>

    <div class="controls">
        <div class="mode-pills">
            <button class="pill" data-time="30">30s</button>
            <button class="pill active-pill" data-time="60">60s</button>
            <button class="pill" data-time="120">120s</button>
        </div>
        <div class="restart">
            <button>↺ Reset</button>
        </div>
    </div>

    <!-- <p class="hint">Click the text area or start typing to begin</p> -->

</div>
    </div>

    <!-- Result Modal -->
   <div id="resultModal" class="modal hidden">
    <div class="modal-content">
        <button class="close">✕</button>
        <div class="modal-header">
            <span id="title">TypeSpree Results</span>
        </div>
        <div class="result-grid">
            <div class="result-item">
                <span class="result-val" id="wordspm">0</span>
                <span class="result-key">WPM</span>
            </div>
            <div class="result-item">
                <span class="result-val" id="charspm">0</span>
                <span class="result-key">CPM</span>
            </div>
            <div class="result-item">
                <span class="result-val" id="mistakesCount">0</span>
                <span class="result-key">Mistakes</span>
            </div>
            <div class="result-item">
                <span class="result-val" id="accuracy">0%</span>
                <span class="result-key">Accuracy</span>
            </div>
        </div>
        <p id="appreciation"></p>
        <button id="cl">Try Again</button>
    </div>
</div>

    <script src="JsFiles/paragraph.js"></script>
    <script src="JsFiles/script.js"></script>
</body>
</html>
